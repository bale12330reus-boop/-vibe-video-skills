<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>封面 · 情绪内耗（竖版 3:4）</title>
  <!-- 竖版 3:4 封面，1080x1440。和视频同一套：纯黑、白色点阵线稿、宋体。截图：无头浏览器窗口 1080x1440。 -->
  <style>
    @font-face { font-family: "Noto Serif SC"; src: url("./assets/fonts/NotoSerifSC-VF.ttf") format("truetype"), local("SimSun"); font-weight: 200 900; }
    html, body { margin: 0; background: #000; }
    #root { position: relative; width: 1080px; height: 1440px; overflow: hidden; background: #000; color: #fff; font-family: "Noto Serif SC", "SimSun", serif; }
    canvas { position: absolute; inset: 0; }
    #txt { position: absolute; left: 0; right: 0; top: 1040px; z-index: 5; text-align: center; }
    .kick { position: absolute; left: 0; right: 0; top: 84px; z-index: 5; text-align: center; font-size: 26px; letter-spacing: 8px; color: rgba(255,255,255,.6); }
    .title { font-size: 104px; font-weight: 800; line-height: 1.22; letter-spacing: 6px; white-space: nowrap; text-shadow: 0 0 24px rgba(255,255,255,.25); }
    .sub { margin-top: 30px; font-size: 42px; font-weight: 500; letter-spacing: 6px; color: rgba(255,255,255,.75); white-space: nowrap; }
    #vignette { position: absolute; inset: 0; z-index: 8; background: radial-gradient(100% 90% at 50% 45%, transparent 55%, rgba(0,0,0,.7) 100%); pointer-events: none; }
    #grain { position: absolute; inset: 0; z-index: 9; background: url("./assets/grain.png") repeat; background-size: 512px 512px; mix-blend-mode: soft-light; opacity: .22; pointer-events: none; }
  </style>
</head>
<body>
  <div id="root">
    <canvas id="fx" width="1080" height="1440"></canvas>
    <div class="kick">VIBE 知识大赏 · 情绪内耗</div>
    <div id="txt"><div class="title">想了一整夜，<br>然后呢？</div><div class="sub">精神内耗，怎么停下来</div></div>
        <div id="vignette"></div>
    <div id="grain"></div>
  </div>
  <script>
  (function () {
    const W = 1080, H = 1440, ctx = document.getElementById("fx").getContext("2d");
    const mkRnd = (s) => () => { s |= 0; s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const lerp = (a, b, p) => a + (b - a) * p;
    const R = mkRnd(20261018);
    function dot(x, y, r, a) { ctx.globalAlpha = Math.min(1, a); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
    // 沿折线撒点：白色虚线点阵
    function dots(pts, step, r = 1.6) {
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], L = Math.hypot(x1 - x0, y1 - y0);
        for (let d = 0; d < L; d += step) { const q = d / L; dot(lerp(x0, x1, q) + (R() - .5) * 1.6, lerp(y0, y1, q) + (R() - .5) * 1.6, r * (.8 + R() * .7), .6 + R() * .4); }
      }
    }
    const ellipse = (cx, cy, rx, ry, a0 = 0, a1 = 6.2832, n = 60) => Array.from({ length: n + 1 }, (_, i) => { const a = lerp(a0, a1, i / n); return [cx + rx * Math.cos(a), cy + ry * Math.sin(a)]; });
    // 浮尘
    for (let i = 0; i < 160; i++) dot(R() * W, R() * H, .6 + R() * 1.1, .1 + R() * .3);
    // 线团（和视频同一个公式）
    const TX = 420, TY = 470, S = 1.95, P = mkRnd(23), ph = [P() * 6, P() * 6, P() * 6], tp = [];
    for (let i = 0; i <= 1500; i++) {
      const u = i / 1500, a = u * 6.2832 * 11;
      const rr = 112 * Math.min(1, u / .05) * (.38 + .62 * Math.abs(Math.sin(u * 6.2832 * 2.3 + ph[0]))) * (.86 + .14 * Math.sin(u * 41 + ph[1]));
      tp.push([TX + S * rr * Math.cos(a + .6 * Math.sin(u * 7 + ph[2])), TY + S * rr * .84 * Math.sin(a)]);
    }
    dots(tp, 6, 1.7);
    // 躺在床上睁着眼的人（视频第 2 幕的画面）
    const bez = (p0, p1, p2, p3, n = 50) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n, v = 1 - u; return [v * v * v * p0[0] + 3 * v * v * u * p1[0] + 3 * v * u * u * p2[0] + u * u * u * p3[0], v * v * v * p0[1] + 3 * v * v * u * p1[1] + 3 * v * u * u * p2[1] + u * u * u * p3[1]]; });
    dots([[90, 980], [990, 980]], 9);
    dots([[190, 980], [190, 756], [210, 738], [232, 756], [232, 844]], 6);
    dots([[232, 844], [890, 844], [890, 914], [190, 914]], 6);
    dots([[870, 914], [870, 980]], 6);
    dots(ellipse(288, 830, 50, 15), 5);
    const head = [303, 802];
    dots(ellipse(head[0], head[1], 24, 24), 4, 1.7);
    dot(312, 797, 2.8, 1);
    dots(bez([328, 838], [448, 772], [678, 780], [830, 844]), 5);
    dots(bez([830, 844], [818, 862], [778, 870], [748, 866], 12), 5);
    // 窗和月牙
    dots([[760, 250], [960, 250], [960, 440], [760, 440], [760, 250]], 7);
    dots([[860, 250], [860, 440]], 7); dots([[760, 345], [960, 345]], 7);
    dots(ellipse(912, 295, 24, 24, -1.5708, 1.5708, 26), 5); dots(ellipse(912, 295, 10, 24, -1.5708, 1.5708, 26), 5);
    // 头顶那根线，连到线团底部
    const tb = [TX + 6, TY + 112 * S * .84 - 12], th = [head[0], head[1] - 28];
    dots(Array.from({ length: 41 }, (_, i) => { const u = i / 40; return [lerp(th[0], tb[0], u) + 14 * Math.sin(u * 8), lerp(th[1], tb[1], u)]; }), 5, 1.6);
    document.title = "ready";
  })();
  </script>
</body>
</html>
